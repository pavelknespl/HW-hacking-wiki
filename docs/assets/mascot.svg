<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hwhacking mascot">
  <defs>
    <clipPath id="badge"><circle cx="32" cy="32" r="31"/></clipPath>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#e8481d"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <!-- circuit trace accents -->
    <g stroke="#2a2a30" stroke-width="1.4" fill="none">
      <path d="M2 14 H14 l4 4 H30"/>
      <path d="M62 50 H48 l-4 -4 H34"/>
      <path d="M6 54 h8"/>
    </g>

    <!-- hair back -->
    <path d="M12 34 C10 16 22 6 32 6 C42 6 54 16 52 34 C53 44 50 56 50 56 L46 40 C46 54 44 58 44 58 L20 58 C20 58 18 54 18 40 L14 56 C14 56 11 44 12 34 Z" fill="url(#hair)"/>

    <!-- face -->
    <path d="M22 28 C22 20 26 16 32 16 C38 16 42 20 42 28 C42 38 38 44 32 44 C26 44 22 38 22 28 Z" fill="#ffe3cb"/>

    <!-- front bangs -->
    <path d="M20 30 C19 18 25 11 32 11 C39 11 45 18 44 30 C42 24 40 21 36 21 C37 24 36 26 36 26 C34 22 31 21 31 21 C31 23 30 25 30 25 C29 22 26 21 24 23 C22 25 21 28 20 30 Z" fill="url(#hair)"/>

    <!-- eyes -->
    <g>
      <ellipse cx="27" cy="31" rx="2.9" ry="3.8" fill="#14141a"/>
      <ellipse cx="37" cy="31" rx="2.9" ry="3.8" fill="#14141a"/>
      <circle cx="27" cy="30" r="1.5" fill="#ff7a3c"/>
      <circle cx="37" cy="30" r="1.5" fill="#ff7a3c"/>
      <circle cx="26" cy="29" r="0.9" fill="#ffffff"/>
      <circle cx="36" cy="29" r="0.9" fill="#ffffff"/>
    </g>
    <!-- blush -->
    <ellipse cx="25" cy="36" rx="2" ry="1.1" fill="#ff9a7a" opacity="0.6"/>
    <ellipse cx="39" cy="36" rx="2" ry="1.1" fill="#ff9a7a" opacity="0.6"/>
    <!-- mouth -->
    <path d="M30 39 Q32 41 34 39" stroke="#c0564b" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- headphones -->
    <path d="M17 30 C17 16 25 10 32 10 C39 10 47 16 47 30" fill="none" stroke="#111114" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="13.5" y="28" width="7" height="11" rx="3" fill="#111114"/>
    <rect x="43.5" y="28" width="7" height="11" rx="3" fill="#111114"/>
    <rect x="15" y="30" width="4" height="7" rx="2" fill="#ff5722"/>
    <rect x="45" y="30" width="4" height="7" rx="2" fill="#ff5722"/>
  </g>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#ff5722" stroke-width="2"/>
</svg>
