    <text x="520" y="285" font-size="74" font-weight="800" fill="#ffffff">hwhacking</text>
    <text x="520" y="345" font-size="34" font-weight="600" fill="#ff5722">.pavelknespl.cz</text>
    <text x="520" y="415" font-size="30" font-weight="400" fill="#b8b8c0">Hardware hacking, firmware security,</text>
    <text x="520" y="455" font-size="30" font-weight="400" fill="#b8b8c0">and embedded reverse engineering.</text>
  </g>
