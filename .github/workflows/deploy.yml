name: Deploy to home LXC

# Only the main branch deploys. Pushes to any other branch never publish:
# the branch filter below means the workflow is not even queued for them.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the job only reads the repo (checkout); it needs nothing else.
permissions:
  contents: read

concurrency:
  group: deploy-home
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned to the self-hosted runner inside the home LXC (label "hwhacking").
    runs-on: [self-hosted, hwhacking]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site and publish to nginx webroot
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt
          .venv/bin/mkdocs build -d /var/www/hwhacking --clean

      - name: Report
        run: echo "Published $(find /var/www/hwhacking -type f | wc -l) files to /var/www/hwhacking"
